name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: andessence-backend-service
  REGION: asia-east1
  REPOSITORY: baidu-drive-transfer
  IMAGE: baidu-drive-transfer
  SERVICE: baidu-drive-transfer

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
            workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
            service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
            token_format: access_token

      - name: Set up Google Cloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
            registry: ${{ env.REGION }}-docker.pkg.dev
            username: oauth2accesstoken
            password: ${{ steps.auth.outputs.access_token }}
                --quiet

      - name: Build image
        run: |
          IMAGE_URI=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}

          docker build \
            --platform linux/amd64 \
            -t $IMAGE_URI:${{ github.sha }} \
            -t $IMAGE_URI:latest \
            .

      - name: Push image
        run: |
          IMAGE_URI=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}

          docker push $IMAGE_URI:${{ github.sha }}
          docker push $IMAGE_URI:latest

      - name: Deploy to Cloud Run
        run: |
          IMAGE_URI=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}

          gcloud run deploy ${{ env.SERVICE }} \
            --image $IMAGE_URI:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --quiet